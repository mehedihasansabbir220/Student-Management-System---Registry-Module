# Lint, typecheck, test (unit + integration against real Postgres) and build
# on every push and pull request. Required check before merging to master.
name: CI

on:
  push:
  pull_request:

# Least privilege: this workflow only reads the repository.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint · Typecheck · Test · Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sms_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # CI-only values. Integration tests wipe TEST_DATABASE_URL, which must differ from DATABASE_URL.
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/sms?schema=public
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/sms_test?schema=public
      JWT_SECRET: ci-only-secret-ci-only-secret-0123456789
      UPLOAD_DIR: ./uploads
      LOG_LEVEL: warn
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      # Third-party actions are pinned to full commit SHAs (tags can be moved).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Create the app database (sms_test is created by the service)
        run: psql "postgresql://postgres:postgres@localhost:5432/postgres" -c "CREATE DATABASE sms;"

      - name: Install
        run: npm ci

      - name: Lint
        run: npx eslint .

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Unit + integration tests
        run: npm test

      - name: Apply migrations to the app database
        run: npx prisma migrate deploy

      - name: Production build
        run: npx next build
        env:
          NEXT_DIST_DIR: .next-verify
